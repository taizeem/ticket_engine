[project]
name = "ticket-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "taizeem0@gmail.com", email = "taizeem0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4.0",
    "channels>=4.1.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
    "django>=5.1,<5.2",
    "prometheus-client>=0.20.0",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.2.4",
    "redis>=5.0.0",
]

[project.scripts]
ticket-engine = "ticket_engine:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "locust>=2.31.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
